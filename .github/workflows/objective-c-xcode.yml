name: Xcode - Build and Analyze

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    name: Build and analyse default scheme using xcodebuild command
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # 1. SPM Dependencies Cache
      # ------------------------------------------------------------------------
      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            Build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # ------------------------------------------------------------------------
      # 2. CocoaPods Cache (Skip if Easydict doesn't use CocoaPods)
      # ------------------------------------------------------------------------
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # ------------------------------------------------------------------------
      # 3. Xcode DerivedData Cache (Build Artifacts)
      # ------------------------------------------------------------------------
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: Build
          key: ${{ runner.os }}-deriveddata-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      # ------------------------------------------------------------------------
      # Build & Package
      # ------------------------------------------------------------------------
      - name: Build
        run: |
          xcodebuild build \
            -workspace Easydict.xcworkspace \
            -scheme Easydict \
            -configuration Release \
            -derivedDataPath Build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""

      - name: Package app
        run: |
          app_path=$(find Build/Products -name "*.app" -type d | head -n 1)
          echo "Found app: $app_path"
          ditto -c -k --keepParent "$app_path" Easydict.app.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Easydict-app
          path: Easydict.app.zip
          if-no-files-found: error
