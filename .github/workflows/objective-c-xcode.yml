name: Xcode - Build and Analyze

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    name: Build and analyse default scheme using xcodebuild command
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # 1. SPM Dependencies Cache
      # ------------------------------------------------------------------------
      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            Build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # ------------------------------------------------------------------------
      # 2. CocoaPods Cache (Skip if Easydict doesn't use CocoaPods)
      # ------------------------------------------------------------------------
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # ------------------------------------------------------------------------
      # 3. Xcode DerivedData Cache (Build Artifacts)
      # ------------------------------------------------------------------------
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: Build
          key: ${{ runner.os }}-deriveddata-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      # ------------------------------------------------------------------------
      # Build & Package
      # ------------------------------------------------------------------------
      - name: Build
        run: |
          xcodebuild build \
            -workspace Easydict.xcworkspace \
            -scheme Easydict \
            -configuration Release \
            -derivedDataPath Build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""

      - name: Import Certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 14)

          # 创建临时钥匙串
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 导入 p12 证书
          echo $MACOS_CERTIFICATE | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Sign App
        run: |
          codesign --force -s "MyLocalCert" "Build/Build/Products/Release/Easydict.app"

      - name: Create DMG
        run: |
          hdiutil create -volname "Easydict" -srcfolder Build/Build/Products/Release/Easydict.app -ov -format UDZO Easydict.dmg

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easydict
          path: Easydict.dmg
          if-no-files-found: error
