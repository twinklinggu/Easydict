name: Xcode - Build and Analyze

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    name: Build and analyse default scheme using xcodebuild command
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json -workspace Easydict.xcworkspace | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default | cat >default
          echo Using default scheme: $default
      - name: Build
        env:
          scheme: ${{ 'default' }}
        run: |
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          # Release 配置默认要求 Developer ID 证书,CI 无证书故覆盖为 ad-hoc 签名(-)
          xcodebuild clean build analyze -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" | xcpretty && exit ${PIPESTATUS[0]}
      - name: Package app
        run: |
          app_path=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          echo "Found app: $app_path"
          ditto -c -k --keepParent "$app_path" Easydict.app.zip
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Easydict-app
          path: Easydict.app.zip
          if-no-files-found: error
